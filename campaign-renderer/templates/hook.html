<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Tajawal';
    src: local('Tajawal'), local('Tajawal-Regular');
    font-weight: 400 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, system-ui, -apple-system, Arial, sans-serif;
    color: #fff;
  }
  #bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0;
  }
  #grad { position: absolute; inset: 0; }
  #scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.18) 45%, rgba(0,0,0,.8) 100%);
  }
  #content { position: absolute; left: 7vw; right: 7vw; bottom: 9vh; }
  #logo {
    width: 9vmin; height: 9vmin; border-radius: 22%; object-fit: cover;
    margin-bottom: 3vh; box-shadow: 0 10px 30px rgba(0,0,0,.4); display: block;
  }
  #headline { font-size: 7.2vmin; font-weight: 900; line-height: 1.06; letter-spacing: -0.01em; }
  #subtext { font-size: 3.3vmin; font-weight: 500; margin-top: 2vh; color: rgba(255,255,255,.86); }
  #bar { width: 14vmin; height: .9vmin; border-radius: 99px; margin-top: 3vh; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grad"></div>
  <div id="scrim"></div>
  <div id="content">
    <img id="logo" />
    <div id="headline"></div>
    <div id="subtext"></div>
    <div id="bar"></div>
  </div>
</div>
<script>
  // Reads window.__DATA = { bg, headline, subtext, logo, color }, injected by render.mjs
  // via page.evaluateOnNewDocument before this script runs.
  var D = window.__DATA || {};
  var color = D.color || '#34e5a4';

  document.getElementById('grad').style.background =
    'radial-gradient(120% 90% at 50% 8%, ' + color + '33 0%, #0d0d0d 55%, #060606 100%)';
  document.getElementById('bar').style.background = color;
  document.getElementById('headline').textContent = D.headline || '';
  document.getElementById('subtext').textContent = D.subtext || '';

  var logoEl = document.getElementById('logo');
  if (D.logo) { logoEl.src = D.logo; } else { logoEl.style.display = 'none'; }

  var bgEl = document.getElementById('bg');
  function preloadBg() {
    return new Promise(function (resolve) {
      if (!D.bg) { resolve(); return; }
      var im = new Image();
      im.onload = function () {
        bgEl.style.backgroundImage = 'url("' + D.bg + '")';
        bgEl.style.opacity = '1';
        resolve();
      };
      im.onerror = function () { resolve(); }; // fall back to the gradient, never block the render
      im.src = D.bg;
    });
  }

  // render.mjs waits on window.__ready (with a timeout) before it starts capturing frames.
  window.__ready = Promise.all([
    preloadBg(),
    (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve(),
  ]);

  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };

  // floor keeps text/logo visibly present even at t=0 (frame 0 must never be blank)
  function enter(el, t, start, dur, rise, floor) {
    var p = clamp((t - start) / dur, 0, 1);
    var e = easeOut(p);
    el.style.opacity = String(floor + (1 - floor) * e);
    el.style.transform = 'translateY(' + ((1 - e) * rise) + 'px)';
  }

  function render(ms) {
    var t = ms / 1000;
    enter(logoEl, t, 0, 0.5, 14, 0.6);
    enter(document.getElementById('headline'), t, 0, 0.5, 20, 0.55);
    enter(document.getElementById('subtext'), t, 0.12, 0.5, 16, 0.5);
    enter(document.getElementById('bar'), t, 0.3, 0.4, 10, 0.4);
    bgEl.style.transform = 'scale(' + (1.03 + Math.min(t, 3) * 0.01) + ')';
  }
  window.render = render;
  render(0);
</script>
</body>
</html>
