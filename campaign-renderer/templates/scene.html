<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1120; }
  #s {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, Arial, sans-serif;
    color: var(--tx,#fff);
  }
  /* IMAGE ON TOP — framed card in the upper zone */
  .card { position: absolute; left: 8vmin; right: 8vmin; top: 10vmin; height: 56vh; border-radius: 4vmin; overflow: hidden;
          box-shadow: 0 5vmin 10vmin rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07); background: var(--bg2,#0e1424); z-index: 2; }
  .card img { position: absolute; inset: -5%; width: 110%; height: 110%; object-fit: cover; }
  .card .edge { position: absolute; left: 0; right: 0; bottom: 0; height: .8vmin; transform-origin: left center; transform: scaleX(0); }
  /* CONTENT (narrated) AT BOTTOM */
  .content { position: absolute; left: 8vmin; right: 8vmin; top: calc(10vmin + 56vh + 5vmin); bottom: 6vmin; z-index: 2; }
  .accent { width: 11vmin; height: 1.1vmin; border-radius: 99px; transform-origin: left center; transform: scaleX(0); margin-bottom: 3.2vmin; }
  .rtl .accent { transform-origin: right center; }
  .headline { font-size: 5.6vmin; font-weight: 800; line-height: 1.22; letter-spacing: -.05vmin; }
  .caption { font-size: 3.1vmin; font-weight: 500; margin-top: 2vmin; color: var(--mut,#b9c2d0); line-height: 1.5; }
</style>
</head>
<body>
<div id="s">
  <div class="card" id="card"><img id="img" /><div class="edge" id="edge"></div></div>
  <div class="content" id="content">
    <div class="accent" id="accent"></div>
    <div class="headline" id="headline"></div>
    <div class="caption" id="caption"></div>
  </div>
</div>
<script src="creative/_motion.js"></script>
<script>
  // Reads window.__DATA = { image, headline, caption, color, lang } injected by render.mjs.
  const D = window.__DATA || {}
  // _motion.js injects Cairo with a URL relative to creative/ — re-declare it
  // with the path that resolves from THIS document so Arabic renders here too.
  const ff = document.createElement('style')
  ff.textContent = "@font-face{font-family:'Cairo';src:url('./creative/fonts/Cairo.ttf') format('truetype');font-weight:200 1000;font-display:block}"
  document.head.appendChild(ff)
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)

  const s = document.getElementById('s')
  const P = window.__M.applyPalette(D)
  const color = P.accent
  window.__M.stage(s, P)
  window.__M.decorate(s, color, { big: 420, small: 300 })
  document.getElementById('accent').style.background = color
  document.getElementById('edge').style.background = color
  document.getElementById('headline').textContent = D.headline || ''
  const capEl = document.getElementById('caption')
  capEl.textContent = D.caption || ''
  if (!D.caption) capEl.style.display = 'none'

  const M = window.__M
  const imgEl = document.getElementById('img')
  M.reg(document.getElementById('card'), 60, 650, 'clipup', { r: 40 })
  M.reg(imgEl, 0, 3400, 'kenburns', { from: 1.02, to: 1.1, dy: -12 })
  M.reg(document.getElementById('edge'), 600, 1050, 'draww')
  M.reg(document.getElementById('accent'), 450, 850, 'draww')
  if (D.headline) M.words(document.getElementById('headline'), 620, 90, 560, { dy: 30 })
  M.reg(capEl, 1000, 1500, 'rise', { dy: 24 })

  M.sceneExit(D, [document.getElementById('card'), document.getElementById('content')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.image) { imgEl.onload = imgEl.onerror = () => fonts.then(done); imgEl.src = D.image }
    else { imgEl.style.display = 'none'; fonts.then(done) }
  })
  window.render(0)
</script>
</body>
</html>
