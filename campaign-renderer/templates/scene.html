<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Tajawal';
    src: local('Tajawal'), local('Tajawal-Regular');
    font-weight: 400 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b0b; }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, system-ui, -apple-system, Arial, sans-serif;
    color: #fff; background: #0b0b0b;
  }
  #imgwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; }
  #band {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 5vh 6vw 6vh;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 35%, rgba(0,0,0,.92) 100%);
  }
  #accent { width: 10vmin; height: .8vmin; border-radius: 99px; margin-bottom: 1.6vh; }
  #headline { font-size: 5.4vmin; font-weight: 800; line-height: 1.1; }
  #caption { font-size: 3vmin; font-weight: 500; margin-top: 1.4vh; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div id="stage">
  <div id="imgwrap"><img id="img" /></div>
  <div id="band">
    <div id="accent"></div>
    <div id="headline"></div>
    <div id="caption"></div>
  </div>
</div>
<script>
  // Reads window.__DATA = { image, headline, caption, color }, injected by render.mjs
  // via page.evaluateOnNewDocument before this script runs.
  var D = window.__DATA || {};
  var color = D.color || '#34e5a4';
  document.getElementById('stage').style.background =
    'linear-gradient(160deg, ' + color + '1a, #0b0b0b 55%)';
  document.getElementById('accent').style.background = color;
  document.getElementById('headline').textContent = D.headline || '';
  document.getElementById('caption').textContent = D.caption || '';

  var imgEl = document.getElementById('img');
  function preloadImg() {
    return new Promise(function (resolve) {
      if (!D.image) { resolve(); return; }
      imgEl.onload = function () { resolve(); };
      imgEl.onerror = function () { resolve(); }; // never block the render on a bad image url
      imgEl.src = D.image;
    });
  }

  window.__ready = Promise.all([
    preloadImg(),
    (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve(),
  ]);

  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };

  function render(ms) {
    var t = ms / 1000;
    var ip = clamp(t / 0.4, 0, 1);
    var ie = easeOut(ip);
    imgEl.style.opacity = String(0.4 + 0.6 * ie);
    imgEl.style.transform = 'scale(' + (0.97 + 0.03 * ie) + ')';

    var bandEl = document.getElementById('band');
    var bp = clamp((t - 0.15) / 0.45, 0, 1);
    var be = easeOut(bp);
    bandEl.style.opacity = String(0.5 + 0.5 * be);
    bandEl.style.transform = 'translateY(' + ((1 - be) * 20) + 'px)';
  }
  window.render = render;
  render(0);
</script>
</body>
</html>
