<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:2}
  .mark{display:flex;flex-direction:column;align-items:center;gap:26px;opacity:0}
  /* Free-form logo: natural aspect ratio, capped to fit the portrait — no
     fixed square, no frame/background/shadow behind it. */
  .mark img{width:auto;height:auto;max-width:360px;max-height:340px;object-fit:contain}
  .mark .name{font-size:58px;font-weight:900;letter-spacing:-.5px}
  .pillwrap{position:relative;display:inline-block;margin-top:70px;overflow:hidden;border-radius:20px}
  .pill{display:inline-block;background:var(--c);color:var(--ctx,#0e1424);border-radius:20px;padding:26px 54px;font-size:54px;font-weight:800;letter-spacing:-.5px;
        box-shadow:0 24px 60px color-mix(in srgb, var(--c) 45%, transparent)}
  .shine{position:absolute;left:0;top:0;bottom:0;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);
         opacity:0;pointer-events:none;transform:translateX(-150%) skewX(-18deg)}
  .url{margin-top:42px;font-size:36px;font-weight:600;color:var(--mut,#b9c2d0);letter-spacing:.5px}
</style></head>
<body><div id="s">
  <div class="wrap">
    <div class="mark" id="mark"></div>
    <div class="pillwrap" id="pillwrap"><span class="pill" id="pill"></span><span class="shine" id="shine"></span></div>
    <div class="url" id="url"></div>
  </div>
</div>
<script src="vendor/anime.min.js"></script>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const s = document.getElementById('s')
  const P = window.__M.applyPalette(D)
  const c = P.accent
  window.__M.stage(s, P)
  window.__M.decorate(s, c)
  { const F = window.__M.fx, sd = F.seedFrom(D); F.lines(s, c, sd, 2); F.particles(s, c, sd + 1, 12) }

  const mark = document.getElementById('mark')
  let logoEl = null
  if (D.brand?.logoUrl) { logoEl = document.createElement('img'); logoEl.src = D.brand.logoUrl; mark.appendChild(logoEl) }
  if (D.brand?.name) mark.appendChild(Object.assign(document.createElement('div'), { className: 'name', textContent: D.brand.name }))

  document.getElementById('pill').textContent = D.text || ''
  const urlEl = document.getElementById('url')
  urlEl.textContent = D.url || D.brand?.domain || ''
  if (!urlEl.textContent) urlEl.style.display = 'none'

  const M = window.__M
  M.reg(mark, 100, 700, 'popback', { rot: 0 })
  M.reg(document.getElementById('pillwrap'), 480, 1050, 'popback', { rot: -2 })
  M.reg(document.getElementById('shine'), 1150, 1900, 'sweep')
  M.reg(urlEl, 900, 1350, 'rise', { dy: 22 })

  M.sceneExit(D, [document.querySelector('.wrap')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (logoEl) { logoEl.onload = logoEl.onerror = () => fonts.then(done) } else fonts.then(done)
  })
  window.render(0)
</script></body></html>
