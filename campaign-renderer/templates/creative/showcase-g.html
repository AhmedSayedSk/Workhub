<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .brand{position:absolute;left:90px;top:84px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;opacity:.92;z-index:5}
  .brand img{height:52px;width:auto;max-width:170px;object-fit:contain;border-radius:10px}
  /* SPOTLIGHT: rotating accent ring behind a zooming square card, copy beneath */
  .ringwrap{position:absolute;left:50%;top:760px;transform:translate(-50%,-50%);width:920px;height:920px;z-index:1}
  .ringwrap svg{width:100%;height:100%}
  .ringwrap .dash{fill:none;stroke:var(--c);stroke-width:5;stroke-dasharray:26 38;opacity:.5}
  .ringwrap .thin{fill:none;stroke:var(--c);stroke-width:2;opacity:.22}
  .card{position:absolute;left:50%;top:760px;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:56px;overflow:hidden;z-index:2;
        box-shadow:0 70px 130px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08);background:var(--bg2,#0e1424)}
  .card img{position:absolute;inset:-50px;width:calc(100% + 100px);height:calc(100% + 100px);object-fit:cover}
  .glow{position:absolute;left:50%;top:760px;transform:translate(-50%,-50%);width:1000px;height:1000px;border-radius:50%;z-index:0;filter:blur(60px)}
  .copy{position:absolute;left:100px;right:100px;top:1310px;text-align:center;z-index:3}
  .caption{font-size:58px;font-weight:800;line-height:1.24;letter-spacing:-.6px;color:var(--tx,#fff)}
  .dotline{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0 0}
  .dotline i{width:12px;height:12px;border-radius:50%;background:var(--c);opacity:0}
  .sub{margin-top:26px;font-size:32px;font-weight:500;line-height:1.5;color:var(--mut,#b9c2d0)}
</style></head>
<body><div id="s">
  <div class="brand" id="brand"></div>
  <div class="glow" id="glow"></div>
  <div class="ringwrap" id="ringwrap"><svg viewBox="0 0 920 920">
    <circle class="dash" id="dash" cx="460" cy="460" r="430"/>
    <circle class="thin" cx="460" cy="460" r="392"/>
  </svg></div>
  <div class="card" id="card"><img id="img" /></div>
  <div class="copy" id="copy">
    <div class="caption" id="caption"></div>
    <div class="dotline"><i></i><i></i><i></i></div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script src="vendor/anime.min.js"></script>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const M = window.__M
  const s = document.getElementById('s')
  const P = M.applyPalette(D)
  M.stage(s, P)
  M.fx.particles(s, P.accent, M.fx.seedFrom(D), 10, { alpha: 0.22 })

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  document.getElementById('glow').style.background = `radial-gradient(circle, ${P.accent}30, transparent 65%)`

  const imgEl = document.getElementById('img')
  const captionEl = document.getElementById('caption')
  captionEl.textContent = D.caption || ''
  const subEl = document.getElementById('sub')
  subEl.textContent = D.sub || ''
  if (!D.sub) subEl.style.display = 'none'
  const dots = Array.from(document.querySelectorAll('.dotline i'))

  M.reg(imgEl, 0, 3800, 'kenburns', { from: 1.04, to: 1.15, dy: -14 })
  M.reg(brand, 0, 400, 'fade')

  // The card scale must not fight the centering translate: animate a nested
  // scale on the img's parent via anime on the card's scale with the same
  // translate preserved in the keyframes.
  const card = document.getElementById('card')
  const words = M.splitWords(captionEl)
  const tl = anime.timeline({ autoplay: false, easing: 'easeOutExpo' })
  tl.add({ targets: card, scale: [0.7, 1], opacity: [0, 1], translateX: '-50%', translateY: '-50%', duration: 780, easing: 'easeOutBack' }, 100)
  tl.add({ targets: document.getElementById('ringwrap'), scale: [0.85, 1], opacity: [0, 1], translateX: '-50%', translateY: '-50%', duration: 700 }, 220)
  tl.add({ targets: document.getElementById('ringwrap'), rotate: '1turn', duration: 22000, easing: 'linear', translateX: '-50%', translateY: '-50%' }, 900)
  tl.add({ targets: words, translateY: [42, 0], opacity: [0, 1], duration: 560, delay: anime.stagger(80) }, 700)
  tl.add({ targets: dots, opacity: [0, 1], scale: [0, 1], duration: 380, delay: anime.stagger(110), easing: 'easeOutBack' }, 1250)
  if (D.sub) tl.add({ targets: subEl, translateY: [24, 0], opacity: [0, 1], duration: 480 }, 1500)
  M.regAnime(tl)

  M.sceneExit(D, [card, document.getElementById('ringwrap'), document.getElementById('copy'), document.getElementById('glow')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.imageUrl) { imgEl.onload = imgEl.onerror = () => fonts.then(done); imgEl.src = D.imageUrl }
    else { imgEl.style.display = 'none'; fonts.then(done) }
  })
  window.render(0)
</script></body></html>
