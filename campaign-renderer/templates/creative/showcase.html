<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .brand{position:absolute;left:90px;top:84px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;opacity:.92;z-index:3}
  .brand img{width:52px;height:52px;border-radius:12px}
  /* IMAGE ON TOP — a large framed card in the upper zone */
  .card{position:absolute;left:90px;right:90px;top:210px;height:1050px;border-radius:44px;overflow:hidden;
        box-shadow:0 60px 110px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);background:var(--bg2,#0e1424);z-index:2}
  .card .ph{position:absolute;inset:0}
  .card img{position:absolute;inset:-50px;width:calc(100% + 100px);height:calc(100% + 100px);object-fit:cover}
  .card .edge{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--c);transform-origin:left center;transform:scaleX(0)}
  /* CONTENT (narrated) AT BOTTOM */
  .content{position:absolute;left:90px;right:90px;top:1330px;bottom:120px;display:flex;flex-direction:column;justify-content:flex-start;z-index:2}
  .accent{width:110px;height:12px;border-radius:8px;background:var(--c);transform-origin:left center;transform:scaleX(0);margin-bottom:34px}
  .rtl .accent{transform-origin:right center}
  .caption{font-size:52px;font-weight:800;line-height:1.28;color:var(--tx,#fff);letter-spacing:-.5px}
  .sub{font-size:33px;font-weight:500;line-height:1.5;color:var(--mut,#b9c2d0);margin-top:22px}
</style></head>
<body><div id="s">
  <div class="brand" id="brand"></div>
  <div class="card" id="card">
    <div class="ph" id="ph"></div>
    <img id="img" />
    <div class="edge" id="edge"></div>
  </div>
  <div class="content" id="content">
    <div class="accent" id="accent"></div>
    <div class="caption" id="caption"></div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const s = document.getElementById('s')
  const P = window.__M.applyPalette(D)
  const c = P.accent
  window.__M.stage(s, P)
  window.__M.decorate(s, c)

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  const ph = document.getElementById('ph')
  ph.style.background = `radial-gradient(120% 100% at 50% 0%, ${c}44, ${P.bg2} 80%)`
  const imgEl = document.getElementById('img')

  const captionEl = document.getElementById('caption')
  captionEl.textContent = D.caption || ''
  const subEl = document.getElementById('sub')
  subEl.textContent = D.sub || ''
  if (!D.sub) subEl.style.display = 'none'
  const content = document.getElementById('content')
  if (!D.caption && !D.sub) content.style.display = 'none'

  const M = window.__M
  // Card: clip-reveals downward, then the image ken-burns for the whole scene.
  M.reg(document.getElementById('card'), 60, 700, 'clipup', { r: 44 })
  M.reg(imgEl, 0, 3400, 'kenburns', { from: 1.02, to: 1.12, dy: -18 })
  M.reg(document.getElementById('edge'), 650, 1150, 'draww')
  // Caption: accent draws, words cascade in, sub follows.
  M.reg(document.getElementById('accent'), 500, 950, 'draww')
  if (D.caption) M.words(captionEl, 700, 90, 620, { dy: 36 })
  if (D.sub) M.reg(subEl, 1250, 1750, 'rise', { dy: 26 })
  M.reg(brand, 0, 400, 'fade')

  M.sceneExit(D, [document.getElementById('card'), content])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.imageUrl) {
      imgEl.onload = () => { ph.style.display = 'none'; fonts.then(done) }
      imgEl.onerror = () => { imgEl.style.display = 'none'; fonts.then(done) } // placeholder gradient stays
      imgEl.src = D.imageUrl
    } else {
      imgEl.style.display = 'none'
      fonts.then(done)
    }
  })
  window.render(0)
</script></body></html>
