<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .brand{position:absolute;left:90px;top:84px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;opacity:.92;z-index:3}
  .brand img{height:72px;width:auto;max-width:230px;object-fit:contain;border-radius:12px}
  /* FULL-HEIGHT framed image card — fills down to the bottom gap; the copy
     overlays the image itself on a gradient scrim. */
  .card{position:absolute;left:90px;right:90px;top:200px;bottom:96px;border-radius:44px;overflow:hidden;
        box-shadow:0 60px 110px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);background:var(--bg2,#0e1424);z-index:2}
  .card .ph{position:absolute;inset:0}
  .card img{position:absolute;inset:-50px;width:calc(100% + 100px);height:calc(100% + 100px);object-fit:cover}
  .card .edge{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--c);transform-origin:left center;transform:scaleX(0);z-index:3}
  /* CONTENT — overlaid on the image, anchored to the card's bottom */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:1;pointer-events:none}
  .content{position:absolute;left:64px;right:64px;bottom:60px;z-index:2}
  .accent{width:110px;height:12px;border-radius:8px;background:var(--c);transform-origin:left center;transform:scaleX(0);margin-bottom:30px}
  .rtl .accent{transform-origin:right center}
  .caption{font-size:66px;font-weight:800;line-height:1.24;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 24px rgba(0,0,0,.45)}
  .sub{font-size:34px;font-weight:500;line-height:1.5;color:rgba(255,255,255,.86);margin-top:20px;text-shadow:0 2px 18px rgba(0,0,0,.45)}
</style></head>
<body><div id="s">
  <div class="brand" id="brand"></div>
  <div class="card" id="card">
    <div class="ph" id="ph"></div>
    <img id="img" />
    <div class="scrim" id="scrim"></div>
    <div class="content" id="content">
      <div class="accent" id="accent"></div>
      <div class="caption" id="caption"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="edge" id="edge"></div>
  </div>
</div>
<script src="vendor/anime.min.js"></script>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const s = document.getElementById('s')
  const P = window.__M.applyPalette(D)
  const c = P.accent
  window.__M.stage(s, P)
  window.__M.decorate(s, c)
  { const F = window.__M.fx, sd = F.seedFrom(D); F.lines(s, c, sd, 2); F.particles(s, c, sd + 1, 10); F.swoosh(s, c, sd + 4) }

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  const ph = document.getElementById('ph')
  ph.style.background = `radial-gradient(120% 100% at 50% 0%, ${c}44, ${P.bg2} 80%)`
  const imgEl = document.getElementById('img')

  const captionEl = document.getElementById('caption')
  captionEl.textContent = D.caption || ''
  const subEl = document.getElementById('sub')
  subEl.textContent = D.sub || ''
  if (!D.sub) subEl.style.display = 'none'
  const content = document.getElementById('content')
  const scrim = document.getElementById('scrim')
  // Readability scrim under the overlaid copy: deep palette tone -> transparent.
  scrim.style.background = `linear-gradient(180deg, transparent 0%, ${P.bg2}55 34%, ${P.bg2}e8 100%)`
  if (!D.caption && !D.sub) { content.style.display = 'none'; scrim.style.display = 'none' }

  const M = window.__M
  // Card: clip-reveals downward, then the image ken-burns for the whole scene.
  M.reg(document.getElementById('card'), 60, 700, 'clipup', { r: 44 })
  M.reg(imgEl, 0, 3400, 'kenburns', { from: 1.02, to: 1.12, dy: -18 })
  M.reg(document.getElementById('edge'), 650, 1150, 'draww')
  // Caption: accent draws, words cascade in, sub follows.
  M.reg(scrim, 450, 950, 'fade')
  M.reg(document.getElementById('accent'), 500, 950, 'draww')
  if (D.caption) M.words(captionEl, 700, 90, 620, { dy: 36 })
  if (D.sub) M.reg(subEl, 1250, 1750, 'rise', { dy: 26 })
  M.reg(brand, 0, 400, 'fade')

  M.sceneExit(D, [document.getElementById('card')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.imageUrl) {
      imgEl.onload = () => { ph.style.display = 'none'; fonts.then(done) }
      imgEl.onerror = () => { imgEl.style.display = 'none'; fonts.then(done) } // placeholder gradient stays
      imgEl.src = D.imageUrl
    } else {
      imgEl.style.display = 'none'
      fonts.then(done)
    }
  })
  window.render(0)
</script></body></html>
