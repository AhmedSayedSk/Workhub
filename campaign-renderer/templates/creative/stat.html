<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;display:none}
  #scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,18,.55),rgba(8,10,18,.85));display:none}
  .brand{position:absolute;left:90px;top:124px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;opacity:.92;z-index:9}
  .brand img{height:72px;width:auto;max-width:230px;object-fit:contain;border-radius:12px}
  .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:2}
  .core{position:relative;display:inline-block;width:640px;height:640px}
  .core svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .core svg .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
  .core svg .prog{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round}
  .value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         font-size:210px;font-weight:900;color:var(--c);letter-spacing:-2px}
  .label{font-size:50px;font-weight:600;color:var(--mut,#b9c2d0);margin-top:34px;letter-spacing:.5px}
</style></head>
<body><div id="s">
  <div id="bg"></div><div id="scrim"></div>
  <div class="brand" id="brand"></div>
  <div class="wrap">
    <div class="core">
      <svg viewBox="0 0 640 640">
        <circle class="track" cx="320" cy="320" r="300"/>
        <circle class="prog" id="prog" cx="320" cy="320" r="300"/>
      </svg>
      <div class="value" id="value"></div>
    </div>
    <div class="label" id="label"></div>
  </div>
</div>
<script src="vendor/anime.min.js"></script>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const s = document.getElementById('s')
  const P = window.__M.applyPalette(D)
  const c = P.accent
  const bgEl = document.getElementById('bg')
  const scrimEl = document.getElementById('scrim')
  if (D.videoBg) {
    // Stock-footage mode: composited under these frames later — render transparent.
    document.documentElement.style.background = 'transparent'
    document.body.style.background = 'transparent'
    s.style.background = 'transparent'
    scrimEl.style.display = 'block'
  } else if (D.bg) {
    bgEl.style.backgroundImage = `url("${D.bg}")`
    bgEl.style.display = 'block'
    scrimEl.style.display = 'block'
    window.__M.stage(s, P)
  } else {
    window.__M.stage(s, P)
    window.__M.decorate(s, c)
  }
  { const F = window.__M.fx, sd = F.seedFrom(D); F.ring(s, c, sd, { period: 12000 }); F.particles(s, c, sd + 1, 10); F.lines(s, c, sd + 3, 2) }

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  const valueEl = document.getElementById('value')
  const labelEl = document.getElementById('label')
  labelEl.textContent = D.label || ''

  const M = window.__M
  // Ring draws around while the number counts up — the classic stat moment.
  const CIRC = 2 * Math.PI * 300
  const prog = document.getElementById('prog')
  prog.style.strokeDasharray = String(CIRC)
  prog.style.strokeDashoffset = String(CIRC)
  M.reg(prog, 150, 1250, 'ringdraw', { circ: CIRC })
  valueEl.textContent = D.value || ''
  M.reg(valueEl, 150, 1100, 'countup', { text: D.value || '' })
  M.words(labelEl, 950, 90, 520, { dy: 26 })
  M.reg(brand, 0, 400, 'fade')

  M.sceneExit(D, [document.querySelector('.wrap')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.bg) { const im = new Image(); im.onload = im.onerror = () => fonts.then(done); im.src = D.bg } else fonts.then(done)
  })
  window.render(0)
</script></body></html>
