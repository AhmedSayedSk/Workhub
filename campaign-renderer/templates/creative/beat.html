<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .brand{position:absolute;left:90px;top:84px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;opacity:.92;z-index:2}
  .brand img{width:52px;height:52px;border-radius:12px}
  .wrap{position:absolute;left:110px;right:110px;top:50%;transform:translateY(-50%);text-align:center;z-index:2}
  .accent{width:110px;height:12px;border-radius:8px;background:var(--c);margin:0 auto 48px;transform-origin:center;transform:scaleY(0)}
  h1{font-size:92px;line-height:1.14;font-weight:900;letter-spacing:-1px}
  .sub{font-size:36px;font-weight:500;color:var(--mut,#b9c2d0);margin-top:40px;line-height:1.45}
  .ghost{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:560px;font-weight:900;color:transparent;
         -webkit-text-stroke:2px rgba(255,255,255,.05);z-index:1;pointer-events:none;line-height:1}
</style></head>
<body><div id="s">
  <div class="brand" id="brand"></div>
  <div class="ghost" id="ghost"></div>
  <div class="wrap">
    <div class="accent" id="accent"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const s = document.getElementById('s')
  const P = window.__M.applyPalette(D)
  const c = P.accent
  window.__M.stage(s, P)
  window.__M.decorate(s, c)

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  // Huge outlined ghost index digit behind the copy (subtle depth cue).
  const ghost = document.getElementById('ghost')
  if (D.index) ghost.textContent = String(D.index).padStart(2, '0'); else ghost.style.display = 'none'

  const titleEl = document.getElementById('title')
  titleEl.textContent = D.title || ''
  const subEl = document.getElementById('sub')
  subEl.textContent = D.sub || ''
  if (!D.sub) subEl.style.display = 'none'

  const M = window.__M
  M.reg(document.getElementById('accent'), 100, 520, 'bar')
  M.words(titleEl, 260, 110, 640, { dy: 46 })
  M.reg(subEl, 900, 1400, 'rise', { dy: 30 })
  M.reg(ghost, 0, 900, 'fade')
  M.reg(brand, 0, 400, 'fade')

  M.sceneExit(D, [document.querySelector('.wrap'), ghost])

  window.__ready = document.fonts ? document.fonts.ready : Promise.resolve()
  window.render(0)
</script></body></html>
