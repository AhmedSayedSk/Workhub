<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .brand{position:absolute;left:90px;top:84px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;opacity:.95;z-index:5}
  .brand img{height:52px;width:auto;max-width:170px;object-fit:contain;border-radius:10px}
  /* DUOTONE POSTER: brand-tinted image + heavy poster type stacked bottom-left */
  .card{position:absolute;left:64px;right:64px;top:170px;bottom:80px;border-radius:40px;overflow:hidden;z-index:2;
        box-shadow:0 60px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06);background:var(--bg2,#0e1424)}
  .card img{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(.92)}
  .tintA{position:absolute;inset:0;mix-blend-mode:multiply;z-index:1}
  .tintB{position:absolute;inset:0;mix-blend-mode:screen;opacity:.36;z-index:1}
  .shade{position:absolute;left:0;right:0;bottom:0;height:58%;z-index:2}
  .copy{position:absolute;left:70px;right:70px;bottom:76px;z-index:3}
  .kick{display:inline-block;font-size:26px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--c);
        border:2px solid var(--c);border-radius:999px;padding:8px 22px;margin-bottom:34px}
  .caption{font-size:84px;font-weight:900;line-height:1.1;letter-spacing:-1.5px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5)}
  .caption .ln{display:block;overflow:visible}
  .blockbar{width:170px;height:16px;background:var(--c);border-radius:8px;margin-top:36px;transform-origin:left center}
  .rtl .blockbar{transform-origin:right center}
  .sub{margin-top:26px;font-size:33px;font-weight:500;line-height:1.5;color:rgba(255,255,255,.85)}
</style></head>
<body><div id="s">
  <div class="brand" id="brand"></div>
  <div class="card" id="card">
    <img id="img" />
    <div class="tintA" id="tintA"></div>
    <div class="tintB" id="tintB"></div>
    <div class="shade" id="shade"></div>
    <div class="copy" id="copy">
      <div class="kick" id="kick"></div>
      <div class="caption" id="caption"></div>
      <div class="blockbar" id="blockbar"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
</div>
<script src="vendor/anime.min.js"></script>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const M = window.__M
  const s = document.getElementById('s')
  const P = M.applyPalette(D)
  M.stage(s, P)
  M.fx.particles(s, P.accent, M.fx.seedFrom(D), 6, { alpha: 0.16 })

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  // Duotone: grayscale image x multiply(accent->deep) + a soft screen lift.
  document.getElementById('tintA').style.background = `linear-gradient(160deg, ${P.accent}cc, ${P.bg2}f2 78%)`
  document.getElementById('tintB').style.background = `radial-gradient(90% 60% at 30% 20%, ${P.accent}55, transparent 70%)`
  document.getElementById('shade').style.background = `linear-gradient(180deg, transparent, ${P.bg2}d8 82%)`

  const imgEl = document.getElementById('img')
  const kick = document.getElementById('kick')
  kick.textContent = D.brand?.name || ''
  if (!kick.textContent) kick.style.display = 'none'
  // Poster headline: caption split into 1-2 stacked lines (by word midpoint).
  const captionEl = document.getElementById('caption')
  const wordsArr = (D.caption || '').split(/\s+/).filter(Boolean)
  const midI = Math.ceil(wordsArr.length / 2)
  const lines = wordsArr.length > 3 ? [wordsArr.slice(0, midI).join(' '), wordsArr.slice(midI).join(' ')] : [wordsArr.join(' ')]
  const lineEls = lines.filter(Boolean).map((t) => {
    const el = document.createElement('span'); el.className = 'ln'; el.textContent = t
    captionEl.appendChild(el); return el
  })
  const subEl = document.getElementById('sub')
  subEl.textContent = D.sub || ''
  if (!D.sub) subEl.style.display = 'none'

  M.reg(imgEl, 0, 3800, 'kenburns', { from: 1.05, to: 1.16, dy: -18 })
  M.reg(document.getElementById('card'), 40, 600, 'clipup', { r: 40 })
  M.reg(brand, 0, 400, 'fade')

  const rtl = s.getAttribute('dir') === 'rtl'
  const tl = anime.timeline({ autoplay: false, easing: 'easeOutExpo' })
  tl.add({ targets: document.getElementById('tintA'), opacity: [0, 1], duration: 700 }, 150)
  tl.add({ targets: kick, translateX: rtl ? [60, 0] : [-60, 0], opacity: [0, 1], duration: 560, easing: 'easeOutBack' }, 420)
  tl.add({ targets: lineEls, translateX: rtl ? [90, 0] : [-90, 0], opacity: [0, 1], duration: 640, delay: anime.stagger(140) }, 620)
  tl.add({ targets: document.getElementById('blockbar'), scaleX: [0, 1], duration: 480 }, 1150)
  if (D.sub) tl.add({ targets: subEl, translateY: [26, 0], opacity: [0, 1], duration: 480 }, 1350)
  M.regAnime(tl)

  M.sceneExit(D, [document.getElementById('card')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.imageUrl) { imgEl.onload = imgEl.onerror = () => fonts.then(done); imgEl.src = D.imageUrl }
    else { imgEl.style.display = 'none'; fonts.then(done) }
  })
  window.render(0)
</script></body></html>
