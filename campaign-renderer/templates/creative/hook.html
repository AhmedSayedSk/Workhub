<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;background:var(--bg2,#0e1424);color:var(--tx,#fff);overflow:hidden}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5}
  #scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,18,.5),rgba(8,10,18,.88))}
  .wrap{position:absolute;left:90px;right:90px;top:500px;z-index:2}
  .kicker{display:inline-block;font-size:27px;letter-spacing:6px;text-transform:uppercase;color:var(--c);font-weight:800;
          background:rgba(255,255,255,.06);border:1px solid var(--c);border-radius:999px;padding:10px 24px;margin-bottom:38px}
  h1{font-size:104px;line-height:1.08;font-weight:900;letter-spacing:-1px}
  h1 .line{display:block;overflow:visible}
  .u{position:relative;display:inline-block}
  .u i{position:absolute;left:0;right:0;bottom:6px;height:16px;background:var(--c);transform-origin:left center;border-radius:8px;z-index:-1;opacity:.9}
  .rtl .u i{transform-origin:right center}
  .brand{position:absolute;left:90px;top:90px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;z-index:2}
  .brand img{width:52px;height:52px;border-radius:12px}
  .chip{position:absolute;right:90px;top:96px;font-size:26px;font-weight:700;color:var(--c);background:rgba(255,255,255,.08);padding:8px 16px;border-radius:999px;z-index:2}
</style></head>
<body><div id="s">
  <div id="bg"></div><div id="scrim"></div>
  <div class="brand" id="brand"></div>
  <div class="wrap"><div class="kicker" id="kicker"></div><h1 id="h1"></h1></div>
</div>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const P = window.__M.applyPalette(D)
  const c = P.accent
  const bg = document.getElementById('bg'); if (D.bg) bg.style.backgroundImage = `url("${D.bg}")`; else window.__M.stage(document.getElementById('s'), P)
  if (!D.bg) window.__M.decorate(document.getElementById('s'), c)
  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  document.getElementById('kicker').textContent = D.kicker || ''
  if (!D.kicker) document.getElementById('kicker').style.display = 'none'

  // Headline: kinetic WORD-BY-WORD reveal — each word rises + fades in on a
  // stagger (reads far punchier than a whole paragraph fading in at once). The
  // underline phrase keeps its draw-on bar, timed just after its words land.
  const M = window.__M
  const h1 = document.getElementById('h1')
  const text = D.headline || ''
  const uBars = []
  // Slow, deliberate word cadence — each word lands ~180ms apart so the hook
  // reads word by word instead of rushing in.
  const START = 260, STAGGER = 180, DUR = 640
  let wi = 0
  const emitWords = (container, str) => {
    const parts = String(str).split(/\s+/).filter(Boolean)
    parts.forEach((w) => {
      const s = document.createElement('span')
      s.textContent = w
      s.style.display = 'inline-block'
      s.style.whiteSpace = 'pre'
      container.appendChild(s)
      container.appendChild(document.createTextNode(' '))
      M.reg(s, START + wi * STAGGER, START + wi * STAGGER + DUR, 'rise', { dy: 44 })
      wi++
    })
  }
  text.split('\n').forEach((lineText) => {
    const line = document.createElement('span'); line.className = 'line'
    if (D.underline && lineText.includes(D.underline)) {
      const [a, b] = lineText.split(D.underline)
      if (a && a.trim()) emitWords(line, a)
      const span = document.createElement('span'); span.className = 'u'
      emitWords(span, D.underline)
      const barStart = START + (wi - 1) * STAGGER + DUR - 140
      const bar = document.createElement('i'); span.appendChild(bar); uBars.push({ bar, start: Math.max(0, barStart) })
      line.appendChild(span)
      if (b && b.trim()) { line.append(document.createTextNode(' ')); emitWords(line, b) }
    } else {
      emitWords(line, lineText)
    }
    h1.appendChild(line)
  })

  M.reg(document.getElementById('kicker'), 80, 560, 'popback', { rot: -3 })
  M.reg(brand, 0, 400, 'fade')
  if (D.bg) M.reg(bg, 0, 3400, 'kenburns', { from: 1.03, to: 1.13, dy: -16 })
  for (const { bar, start } of uBars) { bar.style.transform = 'scaleX(0)'; M.reg(bar, start, start + 520, 'underline') }

  M.sceneExit(D, [document.querySelector('.wrap')])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.bg) { const im = new Image(); im.onload = im.onerror = () => fonts.then(done); im.src = D.bg } else fonts.then(done)
  })
  window.render(0)
</script></body></html>
