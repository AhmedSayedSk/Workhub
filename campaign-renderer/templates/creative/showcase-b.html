<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #s{position:relative;width:100%;height:100%;color:var(--tx,#fff);overflow:hidden}
  .brand{position:absolute;left:90px;top:124px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;opacity:.92;z-index:4}
  .brand img{height:72px;width:auto;max-width:230px;object-fit:contain;border-radius:12px}
  /* SPLIT PANEL: image upper zone with slanted bottom edge, solid copy panel below */
  .imgwrap{position:absolute;left:90px;right:90px;top:200px;height:1080px;border-radius:44px;overflow:hidden;z-index:2;
           box-shadow:0 60px 110px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);background:var(--bg2,#0e1424);
           clip-path:polygon(0 0,100% 0,100% 92%,0 100%)}
  .imgwrap img{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover}
  .slant{position:absolute;left:90px;right:90px;top:200px;height:1080px;z-index:3;pointer-events:none}
  .slant i{position:absolute;left:0;right:0;bottom:2%;height:14px;background:var(--c);transform-origin:left center;transform:scaleX(0) rotate(-2.4deg)}
  .panel{position:absolute;left:90px;right:90px;top:1330px;bottom:150px;border-radius:36px;background:var(--bg1,#101828);
         box-shadow:0 40px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);z-index:2;padding:56px 60px;overflow:hidden}
  .panel .sidebar{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--c);transform-origin:center top;transform:scaleY(0)}
  .rtl .panel .sidebar{left:auto;right:0}
  .caption{font-size:60px;font-weight:800;line-height:1.26;letter-spacing:-.5px;color:var(--tx,#fff)}
  .sub{font-size:32px;font-weight:500;line-height:1.5;color:var(--mut,#b9c2d0);margin-top:18px}
  .numchip{position:absolute;right:150px;top:1262px;background:var(--c);color:var(--ctx,#0b0f18);font-weight:900;font-size:64px;
           padding:18px 36px;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.45);letter-spacing:-1px;z-index:4}
  .rtl .numchip{right:auto;left:150px}
</style></head>
<body><div id="s">
  <div class="brand" id="brand"></div>
  <div class="imgwrap" id="imgwrap"><img id="img" /></div>
  <div class="slant"><i id="slantbar"></i></div>
  <div class="numchip" id="numchip"></div>
  <div class="panel" id="panel">
    <div class="sidebar" id="sidebar"></div>
    <div class="caption" id="caption"></div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script src="vendor/anime.min.js"></script>
<script src="_motion.js"></script>
<script>
  const D = window.__DATA || {}
  if (window.__M && window.__M.applyLang) window.__M.applyLang(D)
  const M = window.__M
  const s = document.getElementById('s')
  const P = M.applyPalette(D)
  M.stage(s, P)
  M.decorate(s, P.accent, { big: 420, small: 300 })
  M.fx.particles(s, P.accent, M.fx.seedFrom(D), 10, { alpha: 0.22 })

  const brand = document.getElementById('brand')
  if (D.brand?.logoUrl) { const im = document.createElement('img'); im.src = D.brand.logoUrl; brand.appendChild(im) }
  brand.appendChild(Object.assign(document.createElement('span'), { textContent: D.brand?.name || '' }))
  if (!D.brand?.name && !D.brand?.logoUrl) brand.style.display = 'none'

  const imgEl = document.getElementById('img')
  const captionEl = document.getElementById('caption')
  captionEl.textContent = D.caption || ''
  const subEl = document.getElementById('sub')
  subEl.textContent = D.sub || ''
  if (!D.sub) subEl.style.display = 'none'

  // Number chip: the first number in the copy becomes a bold stat badge.
  const numchip = document.getElementById('numchip')
  const numMatch = `${D.caption || ''} ${D.sub || ''}`.match(/[+٪%$€£]?[\d٠-٩]+[+٪%kKمM×x]*/)
  if (numMatch) numchip.textContent = numMatch[0]
  else numchip.style.display = 'none'

  // Motion: image pans sideways (direction alternates by scene index), slant
  // bar draws, panel rises with overshoot, words cascade, chip pops (anime.js).
  const dir = (D.index || 1) % 2 === 0 ? 1 : -1
  M.reg(imgEl, 0, 3600, 'kenburns', { from: 1.08, to: 1.16, dx: dir * 34, dy: -8 })
  M.reg(document.getElementById('imgwrap'), 40, 620, 'clipup', { r: 44 })
  M.reg(document.getElementById('slantbar'), 500, 1000, 'draww')
  M.reg(document.getElementById('sidebar'), 620, 1040, 'bar')
  M.reg(brand, 0, 400, 'fade')

  const words = M.splitWords(captionEl)
  const tl = anime.timeline({ autoplay: false, easing: 'easeOutExpo' })
  tl.add({ targets: document.getElementById('panel'), translateY: [140, 0], opacity: [0, 1], duration: 700, easing: 'easeOutBack' }, 420)
  tl.add({ targets: words, translateY: [46, 0], opacity: [0, 1], duration: 560, delay: anime.stagger(80) }, 760)
  if (D.sub) tl.add({ targets: subEl, translateY: [26, 0], opacity: [0, 1], duration: 480 }, 1350)
  if (numMatch) tl.add({ targets: numchip, scale: [0, 1], rotate: [-8, 0], opacity: [0, 1], duration: 620, easing: 'easeOutElastic(1, .7)' }, 1050)
  M.regAnime(tl)

  M.sceneExit(D, [document.getElementById('imgwrap'), document.getElementById('panel'), document.querySelector('.slant'), numchip])

  window.__ready = new Promise((res) => {
    const done = () => res()
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve()
    if (D.imageUrl) { imgEl.onload = imgEl.onerror = () => fonts.then(done); imgEl.src = D.imageUrl }
    else { imgEl.style.display = 'none'; fonts.then(done) }
  })
  window.render(0)
</script></body></html>
