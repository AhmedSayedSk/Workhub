services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3090:3090"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      # Mirrors the host home inside the container so tooling that writes there
      # (caches, credentials, nvm) keeps working. ${HOME} comes from the shell
      # running compose, so this stays correct on any machine.
      - ${HOME}:${HOME}
      - /mnt:/mnt
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - HOME=${HOME}
    command: >
      bash -c "
        npm install &&
        npx next dev --webpack -p 3090 -H 0.0.0.0
      "
