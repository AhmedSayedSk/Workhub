services:
  vps-agent:
    build: { context: .., dockerfile: vps-agent/Dockerfile }
    container_name: vps-agent
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_PROXY_URL: http://vps-agent-dockerproxy:2375
      SECURITY_STATUS_PATH: /security/status.json
      CRON_STATUS_PATH: /security/cron.json
    volumes:
      - /opt/_security/status.json:/security/status.json:ro
      # Host cron inventory (cron-status.sh, root cron every 5 min). Like
      # status.json, the file MUST exist on the host before `up`, or Docker
      # will create a directory in its place.
      - /opt/_security/cron.json:/security/cron.json:ro
      # The edge proxy's own config, read-only — the only self-maintaining
      # source of the domains the TLS panel probes. Either a single Caddyfile
      # or a directory of site fragments; set CADDY_SITES_HOST_PATH in .env
      # when this box keeps it somewhere else.
      - ${CADDY_SITES_HOST_PATH:-/opt/edge/Caddyfile}:/etc/caddy-sites:ro
    depends_on: [vps-agent-dockerproxy]
    # Default bridge network — vps-agent needs OUTBOUND egress to reach
    # WorkHub (WORKHUB_REPORT_URL). It also joins agent_internal so it can
    # still reach the docker-socket-proxy sidecar by service name.
    networks: [default, agent_internal]
  vps-agent-dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: vps-agent-dockerproxy
    restart: unless-stopped
    environment: { CONTAINERS: 1, IMAGES: 1, INFO: 1, PING: 1, SYSTEM: 1, POST: 0 }
    # Cap the access log — this proxy logs every Docker API poll, so an
    # uncapped json-file log grows unbounded (a 492MB log was found on VPS1).
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    # No host port published, and no default-network membership — the proxy
    # is reachable only from vps-agent via agent_internal, and (per its own
    # POST:0 lockdown) can't be used to mutate the Docker daemon even so.
    networks: [agent_internal]
networks:
  default: {}
  agent_internal: { internal: true }
